[project]
name = "pressure"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anthony Ticinovic", email = "aticinovic@woolworths.com.au" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=5.0.1",
    "huggingface-hub>=1.28.0",
    "inspect-ai>=0.3.259",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "torch>=2.13.0",
    "transformers>=5.15.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads real model weights"]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "inspect-ai>=0.3.259",
    "pytest>=9.1.1",
]
